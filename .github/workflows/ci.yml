name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_16.4.app
    - name: Run tests
      run: swift test

  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=iOS Simulator
          - generic/platform=tvOS Simulator
          - generic/platform=watchOS Simulator
          - generic/platform=visionOS Simulator
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_16.4.app
    - name: Build
      run: xcodebuild build -scheme GrowthBookOpenFeature -destination '${{ matrix.destination }}'

  example:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_16.4.app
    - name: Run example
      run: swift run --package-path Examples/CommandLine
